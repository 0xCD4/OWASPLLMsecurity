<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OWASP LLM Security Lab{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">OWASP LLM Security Lab</a>
            <span class="nav-version">v1.0 | Top 10 for LLM 2025</span>
        </div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="https://genai.owasp.org/llm-top-10/" target="_blank" rel="noopener">OWASP Reference</a>
            <a href="https://atlas.mitre.org/" target="_blank" rel="noopener">MITRE ATLAS</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>OWASP LLM Security Lab - Educational Purpose Only |
           <a href="https://github.com/0xCD4/OWASPLLMsecurity" target="_blank" rel="noopener">GitHub</a> |
           Built for AI/LLM Security Training
        </p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
